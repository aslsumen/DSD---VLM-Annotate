[project]
name = "video-grounding"
version = "0.1.0"
description = "Zero-shot natural-language video event grounding and clip export (VideoJev System One)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6", "pydantic>=2.6"]

[project.optional-dependencies]
# torch must match the host CUDA; install it first. flash-attn / causal-conv1d need
# `pip install ... --no-build-isolation` and are documented in docs/COMPATIBILITY.md.
videojev = [
  "transformers==5.14.1", "accelerate", "safetensors", "pillow", "av==18.1.0",
  "flash-linear-attention==0.4.2", "fla-core==0.4.2", "huggingface_hub",
  "torchvision",  # Qwen3VLVideoProcessor requires it; not in upstream install list
]

server = ["fastapi>=0.110", "uvicorn>=0.29"]
gemini = [
    "google-genai>=3.2.0",
]

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
video-grounding = "video_grounding.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_grounding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
